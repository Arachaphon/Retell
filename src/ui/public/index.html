<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bilingual Reader</title>
    <link rel="stylesheet" href="/ui/style.css?v=9" />
  </head>
  <body>
    <header class="topbar">
      <div class="title-block">
        <div class="site-name">Bilingual Reader</div>
        <button id="home-btn" class="home-btn" type="button">ชั้นวางหนังสือ</button>
      </div>
      <div class="controls">
        <button id="font-sm" class="icon-btn" type="button" aria-label="ลดขนาดตัวอักษร">A-</button>
        <button id="font-lg" class="icon-btn" type="button" aria-label="เพิ่มขนาดตัวอักษร">A+</button>
      </div>
    </header>

    <main id="app"></main>
    <p id="status" class="status" role="status"></p>

    <dialog id="story-dialog"></dialog>

    <div id="toast" class="toast"></div>

    <script src="/ui/app.js?v=9" type="module"></script>
  </body>
</html>
